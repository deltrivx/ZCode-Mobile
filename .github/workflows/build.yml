name: Build Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ZCodeMobile.xcodeproj \
            -scheme ZCodeMobile \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ZCodeMobile.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/ZCodeMobile.xcarchive/Products/Applications/ZCodeMobile.app" "build/Payload/"
          cd build
          zip -qry "ZCodeMobile-unsigned.ipa" Payload
          ls -lh ZCodeMobile-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZCodeMobile-unsigned-ipa
          path: build/ZCodeMobile-unsigned.ipa

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ZCodeMobile-unsigned.ipa
